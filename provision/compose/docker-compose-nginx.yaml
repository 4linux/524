version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Mapeando corretamente
    networks:
      - devops

volumes:
  nginx:
  

networks:
  devops:
    external: true
